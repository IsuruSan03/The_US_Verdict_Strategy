name: Daily US Verdict Post

on:
  schedule:
    # All times below assume US Eastern Daylight Time (EDT = UTC-4), which is what
    # the US will be on for most of the year including now (July). In EST (UTC-5,
    # roughly Nov-Mar) everything here lands ONE HOUR LATER in US local time —
    # shift each cron hour -1 if you want it pinned exactly through winter.

    # Daily baseline evening slot: 7:00 PM EDT ("Evening (All Days) 7-9 PM" — HIGH)
    - cron: "0 23 * * *"

    # Extra Tue/Wed/Thu prime slot: 12:00 PM EDT ("Prime Time" — HIGH, your best days)
    - cron: "0 16 * * 2,3,4"

  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: node daily_post.js
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
